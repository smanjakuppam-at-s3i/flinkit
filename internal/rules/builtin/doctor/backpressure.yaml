# Doctor rules — backpressure.
# Finding IDs are stable once released and must never be renumbered.
rules:
  - id: DOC-BP-001
    category: doctor
    severity: medium
    applies_to: [oss, cp, cc]
    match:
      backpressured: true
    message: "Sustained backpressure: a downstream operator cannot keep up."
    fix: Run `flinkit bottleneck <job>` to find the choke point, then raise its parallelism or address its cause.
    docs: https://flinkit.dev/rules/DOC-BP-001
