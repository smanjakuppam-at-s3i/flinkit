# Doctor rules — checkpointing.
# Finding IDs are stable once released and must never be renumbered.
rules:
  - id: DOC-CKPT-001
    category: doctor
    severity: high
    applies_to: [oss, cp, cc]
    match:
      checkpoints_failed: true
    message: Checkpoints are failing; the job cannot recover cleanly from failure.
    fix: Investigate checkpoint timeouts, state size, and backend I/O; check the JobManager logs for the failure cause.
    docs: https://flinkit.dev/rules/DOC-CKPT-001
