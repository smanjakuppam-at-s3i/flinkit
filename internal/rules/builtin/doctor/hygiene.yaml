# Doctor rules — operational hygiene.
# Finding IDs are stable once released and must never be renumbered.
rules:
  - id: DOC-HYG-001
    category: doctor
    severity: medium
    applies_to: [oss, cp, cc]
    match:
      missing_operator_uid: true
    message: Stateful operators without a stable UID break savepoint restore across job changes.
    fix: Assign a uid() to every stateful operator.
    docs: https://flinkit.dev/rules/DOC-HYG-001
