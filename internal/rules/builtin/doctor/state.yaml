# Doctor rules — state health.
# Finding IDs are stable once released and must never be renumbered.
rules:
  - id: DOC-STATE-001
    category: doctor
    severity: high
    applies_to: [oss, cp, cc]
    match:
      state_without_ttl: true
    message: Unbounded keyed state without a TTL will grow without bound.
    fix: Set table.exec.state.ttl (SQL) or a StateTtlConfig (DataStream) on the operator's state.
    docs: https://flinkit.dev/rules/DOC-STATE-001
